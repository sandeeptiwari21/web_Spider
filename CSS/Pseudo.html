    <!--  
        **.+->
        Pseudo -class
        * it is one type of selector 
        * Used to change the state of whole selected html element.
        * it targets html elements on links available on web page and based on user interaction and based on position of element dom.
        *Syntax:
           selector : pseudo-class{
               css property
           }
       ** TYPES:
         1.Link -> Changes the state of unvisitedlinks available on web page 
         2. visited-> changes the stste of visited links on the web page
         3.active -> It show the active state of an html element ,when use clicks on html element
         4 hover -> change the state of an html element user takes cursor over element
         5. focus -> Used to change the state of an input element when user clicks on its
         6 first-child -> 
         7. last-child
         8. nth-child
         9. checked -> chnage the element when element is checked
         10 has() -> 
         11.not()
         12 root      
     
     --> 
         <style>
            .links>a{
                text-decoration: none;
                font-size: 1.3rem;
                line-height: 80px;
            }
            .links>a:link{
                color:red;
            }
            .links>a:visited{
                color: brown;
            }
            .links>a:active{
                color:yellowgreen;
            }
            .links>a:hover{
                color: magenta;
                font-size: 5rem;
                font-family: 'Segoe UI','Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            }
            .links>a:focus{
                background-color: red;
            }
            .links>a:first-child{
                color: black;
            }
            .links>a:last-child{
                background-color: green;
            }
            .links>a:nth-child(3){
                color: black;
            }
            button{
                height:60px;
                width:300px;
                margin-left: 20px;
                background: linear-gradient(30deg,lightskyblue,indigo);
                border:none;
                border-radius: 15px;
                font-size: 1.2rem;
                font-weight: 600;
                outline: 3px white solid;
                outline-offset: -10px;
                color: white;
                transition: all 200ms linear;
            }
            button:active{
                transform: scale(0.95);
            }

            button:hover{
                outline: 3px color-mix(in srgb, blueviolet 50%, magenta 50%) solid;
                outline-offset: 7px;
            }

            .links>a:hover{
                color:lemonchiffon;
                font-size: 5rem;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                text-shadow: 5px 4px 0px black;
                font-weight: 900;
            }


         </style>
