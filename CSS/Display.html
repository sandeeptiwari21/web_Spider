    <!-- Display property
     >> Display property Defines the display behavior of an html element
     >> Types
        1>Block
        2> None
        3> Inline
        4> Inline- block
        5> flex

    *Block 
        -> it is difault for some elements.
        -> block element always consume  whole width of window
        -> Block elements starts with the new line.
        ->Block elements accepts hight and width.
        ->EX : all heading tags, <div>,<li>, <P> ..etc    
    ** None 
        -> Eliminates elements completely from window layout
        *INLINE 
        -> it is def for few html elemnets
        -> Display elemenyts as inline i.e in same line side by side.
        -> Height and width wont have any effect.
    *inline- block
     -> Makes element to be displayed in same line as inline-level
     -> Elements accepts height and width    .
     -->
            <h1>SSpiders</h1>

          <style>
            /* Navigation bar in laptop screen exa,mple for inline */
            nav{
                background-color: aqua;
                height: 60px;
                /* width: 250px; */
                border-radius: 20px;
                text-align: center;
                padding-top: 20px;
                box-sizing: border-box;
                margin-bottom: 10px;
            }

            nav a{
                text-decoration: none;
                padding: 12px 40px;
                font-size: 1.2rem;
                color: darkgreen;
                font-weight: 900;
                border-radius: 15px;
            }

            nav a:hover{
                background-color: gray;
                 color:blanchedalmond;
                 border-radius: 5PX;
                 font-size: 1.5rem;
                 outline: none;
                 text-decoration: none;
            }

            /* Converting navigation bar to mobile screen: inline to block */
            .secondary-nav{
                height: fit-content;
                width: 100%;
                padding: 20px;
            }
            .secondary-nav a{
                display: block;
            }
         
               
          </style>
