    <!--
     •-> Scrooling Text
        -> Stands for moving text
        -> <marque> tag is used to insert scrolling text into the web page
       -> Syntax:
           <marque behavior="" direction="">content</marque>
        -> Attributes:
           1.behavior : scroll, alternate
           2. direction: right,left, up and down
           3. loop : repeatation
           4. scrollamount: Speed    
    -->
           <!--
           <marquee behavior="scroll" direction="left">Hello user, welcome to my page ......</marquee>

           <marquee behavior="scroll" direction="up">Hello user, welcome to my page ......</marquee>
           <marquee behavior="scroll" direction="down">Hello user, welcome to my page ......</marquee>
           <br>
           <marquee behavior="alternate" direction="left">Hello user, welcome to my page ......</marquee>
           <br>
