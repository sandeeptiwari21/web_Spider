<body align="center">
    <!--
    ** TABLE
    -> Arranging the data into rows and columns
    -> <table> is used to create table
    -> Also contains  <tr>(row),<th> (head) <td> (data) 
    ** SYNTAX:
        <table>
            <tr>
                <th>head</th>
                <th>head</th>
                <th>head</th>
                <th.head</th>
            </tr>
            <tr>
                <td>data </td>
                <td> data </td>
                <td.> data </td.
            </tr>
        </table>   
        
    ** ATTRIBUTES:
       1>border
       2>rowspan
       3>colspan
       4>cell padding   
       5.cell Spacing
       6> Style:
            a> border-collapse
            b> float
            c> text-align
       7>bg-color 
    -->
